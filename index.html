<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolBox Hub | Všechny nástroje na jednom místě</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --sidebar: #ffffff;
            --card: #ffffff;
            --text: #1d1d1f;
            --text-sec: #86868b;
            --accent: #0071e3;
            --btn-hover: #f0f0f2;
            --border: #d2d2d7;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg: #121212;
            --sidebar: #1c1c1e;
            --card: #2c2c2e;
            --text: #f5f5f7;
            --text-sec: #a1a1a6;
            --accent: #0a84ff;
            --btn-hover: #3a3a3c;
            --border: #48484a;
            --shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        /* SIDEBAR */
        nav {
            width: 280px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .logo { font-size: 1.5rem; font-weight: 800; margin-bottom: 40px; color: var(--accent); display: flex; align-items: center; gap: 10px; }

        .nav-item {
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 5px;
            display: flex; align-items: center; gap: 12px;
            color: var(--text-sec);
            font-weight: 500;
        }

        .nav-item:hover { background: var(--btn-hover); color: var(--text); }
        .nav-item.active { background: var(--accent); color: white; }

        /* MAIN CONTENT */
        main { flex-grow: 1; margin-left: 280px; padding: 40px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }

        .tool-section { display: none; animation: fadeIn 0.4s ease-out; }
        .tool-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* UI ELEMENTS */
        .card { background: var(--card); padding: 30px; border-radius: 24px; box-shadow: var(--shadow); max-width: 800px; }
        .grid-tool { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        
        input, select, textarea {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); margin: 10px 0; font-size: 1rem;
        }

        button.primary {
            background: var(--accent); color: white; border: none; padding: 12px 24px;
            border-radius: 12px; cursor: pointer; font-weight: 600; width: 100%;
        }
        button.primary:hover { opacity: 0.9; transform: translateY(-2px); }

        /* SPECIFIC TOOLS STYLES (CALCULATOR REUSED) */
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-btn { padding: 20px; border-radius: 15px; border: none; background: var(--btn-hover); color: var(--text); cursor: pointer; font-weight: 600; }
        .calc-display { background: var(--bg); padding: 20px; border-radius: 15px; text-align: right; margin-bottom: 15px; font-size: 2rem; min-height: 80px; }

        /* THEME TOGGLE */
        .theme-btn {
            background: var(--btn-hover); border: none; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer; font-size: 1.2rem;
        }

        @media (max-width: 900px) {
            nav { width: 80px; padding: 20px 10px; }
            nav .logo span, nav .nav-item span { display: none; }
            main { margin-left: 80px; padding: 20px; }
        }
    </style>
</head>
<body data-theme="dark">

    <nav>
        <div class="logo">🛠️ <span>ToolBox</span></div>
        <div class="nav-item active" onclick="showTool('calc', this)"><span>🧮</span> <span>Kalkulačka</span></div>
        <div class="nav-item" onclick="showTool('pass', this)"><span>🔐</span> <span>Generátor hesel</span></div>
        <div class="nav-item" onclick="showTool('units', this)"><span>📏</span> <span>Převodník</span></div>
        <div class="nav-item" onclick="showTool('text', this)"><span>✍️</span> <span>Text Tools</span></div>
        <div class="nav-item" onclick="showTool('color', this)"><span>🎨</span> <span>Barvy</span></div>
    </nav>

    <main>
        <header>
            <h1 id="tool-title">Kalkulačka</h1>
            <button class="theme-btn" onclick="toggleTheme()">☀️</button>
        </header>

        <!-- KALKULAČKA -->
        <section id="tool-calc" class="tool-section active">
            <div class="card" style="max-width: 400px;">
                <div class="calc-display" id="display">0</div>
                <div class="calc-grid">
                    <button class="calc-btn" onclick="calcClear()" style="color:#ff3b30">AC</button>
                    <button class="calc-btn" onclick="calcInput('/')">÷</button>
                    <button class="calc-btn" onclick="calcInput('*')">×</button>
                    <button class="calc-btn" onclick="calcDel()">⌫</button>
                    
                    <button class="calc-btn" onclick="calcInput('7')">7</button>
                    <button class="calc-btn" onclick="calcInput('8')">8</button>
                    <button class="calc-btn" onclick="calcInput('9')">9</button>
                    <button class="calc-btn" onclick="calcInput('-')">-</button>
                    
                    <button class="calc-btn" onclick="calcInput('4')">4</button>
                    <button class="calc-btn" onclick="calcInput('5')">5</button>
                    <button class="calc-btn" onclick="calcInput('6')">6</button>
                    <button class="calc-btn" onclick="calcInput('+')">+</button>
                    
                    <button class="calc-btn" onclick="calcInput('1')">1</button>
                    <button class="calc-btn" onclick="calcInput('2')">2</button>
                    <button class="calc-btn" onclick="calcInput('3')">3</button>
                    <button class="calc-btn" style="background: var(--accent); color:white; grid-row: span 2;" onclick="calcFinal()">=</button>
                    
                    <button class="calc-btn" style="grid-column: span 2;" onclick="calcInput('0')">0</button>
                    <button class="calc-btn" onclick="calcInput('.')">.</button>
                </div>
            </div>
        </section>

        <!-- GENERÁTOR HESEL -->
        <section id="tool-pass" class="tool-section">
            <div class="card">
                <h3>Vytvořit bezpečné heslo</h3>
                <input type="text" id="pass-output" readonly placeholder="Klikněte na generovat" style="font-family: monospace; font-size: 1.2rem; text-align: center;">
                <div style="margin: 20px 0;">
                    <label>Délka: <span id="length-val">16</span></label>
                    <input type="range" id="pass-length" min="8" max="50" value="16" oninput="document.getElementById('length-val').innerText=this.value">
                </div>
                <button class="primary" onclick="generatePass()">Generovat heslo</button>
            </div>
        </section>

        <!-- PŘEVODNÍK JEDNOTEK -->
        <section id="tool-units" class="tool-section">
            <div class="card">
                <div class="grid-tool">
                    <div>
                        <label>Z (Kilometry)</label>
                        <input type="number" id="unit-from-val" value="1" oninput="convertUnits()">
                    </div>
                    <div>
                        <label>Na (Míle)</label>
                        <input type="number" id="unit-to-val" readonly>
                    </div>
                </div>
                <p style="margin-top: 20px; color: var(--text-sec);">Jednoduchý převod km na míle (a obráceně).</p>
            </div>
        </section>

        <!-- TEXT TOOLS -->
        <section id="tool-text" class="tool-section">
            <div class="card">
                <textarea id="text-input" rows="8" placeholder="Vložte text..." oninput="analyzeText()"></textarea>
                <div class="grid-tool" style="margin-top: 10px;">
                    <button class="calc-btn" onclick="textCase('up')">VELKÁ</button>
                    <button class="calc-btn" onclick="textCase('low')">malá</button>
                    <button class="calc-btn" onclick="textCase('clean')">Bez diakritiky</button>
                </div>
                <div style="margin-top: 20px; display: flex; gap: 20px;">
                    <span>Znaky: <strong id="count-char">0</strong></span>
                    <span>Slova: <strong id="count-word">0</strong></span>
                </div>
            </div>
        </section>

        <!-- COLOR TOOLS -->
        <section id="tool-color" class="tool-section">
            <div class="card" style="text-align: center;">
                <input type="color" id="color-picker" value="#0071e3" style="height: 150px; cursor: pointer; padding: 5px;" oninput="updateColor(this.value)">
                <h2 id="color-hex" style="margin: 15px 0;">#0071E3</h2>
                <button class="primary" onclick="copyColor()">Kopírovat HEX</button>
            </div>
        </section>
    </main>

    <script>
        // NAVIGATION LOGIC
        function showTool(toolId, btn) {
            document.querySelectorAll('.tool-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            document.getElementById('tool-' + toolId).classList.add('active');
            btn.classList.add('active');
            document.getElementById('tool-title').innerText = btn.innerText;
        }

        function toggleTheme() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.querySelector('.theme-btn').innerText = isDark ? '🌙' : '☀️';
        }

        // --- TOOL: CALCULATOR ---
        let calcVal = "0";
        function calcInput(val) {
            if(calcVal === "0") calcVal = val;
            else calcVal += val;
            document.getElementById('display').innerText = calcVal;
        }
        function calcClear() { calcVal = "0"; document.getElementById('display').innerText = calcVal; }
        function calcDel() { calcVal = calcVal.slice(0,-1) || "0"; document.getElementById('display').innerText = calcVal; }
        function calcFinal() {
            try { calcVal = eval(calcVal).toString(); } 
            catch { calcVal = "Chyba"; }
            document.getElementById('display').innerText = calcVal;
        }

        // --- TOOL: PASS GENERATOR ---
        function generatePass() {
            const length = document.getElementById('pass-length').value;
            const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
            let retVal = "";
            for (let i = 0; i < length; ++i) {
                retVal += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            document.getElementById('pass-output').value = retVal;
        }

        // --- TOOL: UNIT CONVERTER ---
        function convertUnits() {
            const from = document.getElementById('unit-from-val').value;
            document.getElementById('unit-to-val').value = (from * 0.621371).toFixed(2);
        }

        // --- TOOL: TEXT TOOLS ---
        function analyzeText() {
            const txt = document.getElementById('text-input').value;
            document.getElementById('count-char').innerText = txt.length;
            document.getElementById('count-word').innerText = txt.trim() ? txt.trim().split(/\s+/).length : 0;
        }
        function textCase(mode) {
            let area = document.getElementById('text-input');
            if(mode === 'up') area.value = area.value.toUpperCase();
            if(mode === 'low') area.value = area.value.toLowerCase();
            if(mode === 'clean') area.value = area.value.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            analyzeText();
        }

        // --- TOOL: COLORS ---
        function updateColor(val) {
            document.getElementById('color-hex').innerText = val.toUpperCase();
        }
        function copyColor() {
            navigator.clipboard.writeText(document.getElementById('color-hex').innerText);
            alert('HEX barva zkopírována!');
        }
    </script>
</body>
</html>
