<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolBox Pro | Multifunkční Web</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --sidebar: #ffffff;
            --card: #ffffff;
            --text: #1d1d1f;
            --text-sec: #86868b;
            --accent: #0071e3;
            --btn-hover: #f0f0f2;
            --border: #d2d2d7;
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
            --btn-sci: #f2f2f7;
        }

        [data-theme="dark"] {
            --bg: #0a0a0a;
            --sidebar: #1c1c1e;
            --card: #2c2c2e;
            --text: #f5f5f7;
            --text-sec: #a1a1a6;
            --accent: #0a84ff;
            --btn-hover: #3a3a3c;
            --border: #48484a;
            --shadow: 0 10px 40px rgba(0,0,0,0.4);
            --btn-sci: #3a3a3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; transition: background 0.3s, color 0.3s; }

        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        /* --- NAVIGACE --- */
        nav {
            width: 260px; background: var(--sidebar); border-right: 1px solid var(--border);
            padding: 30px 20px; display: flex; flex-direction: column; position: fixed; height: 100vh;
        }
        .logo { font-size: 1.5rem; font-weight: 800; margin-bottom: 40px; color: var(--accent); letter-spacing: -1px; }
        .nav-item {
            padding: 14px 18px; border-radius: 12px; cursor: pointer; margin-bottom: 8px;
            display: flex; align-items: center; gap: 15px; color: var(--text-sec); font-weight: 500;
        }
        .nav-item:hover { background: var(--btn-hover); color: var(--text); }
        .nav-item.active { background: var(--accent); color: white; }

        /* --- HLAVNÍ OBSAH --- */
        main { flex-grow: 1; margin-left: 260px; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        .theme-btn {
            background: var(--btn-hover); border: none; width: 45px; height: 45px;
            border-radius: 50%; cursor: pointer; font-size: 1.2rem; color: var(--text);
        }

        .tool-section { display: none; width: 100%; max-width: 900px; animation: slideUp 0.4s ease; }
        .tool-section.active { display: flex; gap: 20px; justify-content: center; align-items: flex-start; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- KALKULAČKA CARD --- */
        .card { background: var(--card); padding: 25px; border-radius: 30px; box-shadow: var(--shadow); width: 100%; }
        .calc-card { width: 380px; flex-shrink: 0; }
        
        .display {
            background: var(--bg); padding: 20px; border-radius: 20px; text-align: right;
            margin-bottom: 20px; cursor: pointer; position: relative;
        }
        #display-history { font-size: 0.8rem; color: var(--text-sec); min-height: 1.2em; }
        #display-main { font-size: 2.5rem; font-weight: 600; overflow: hidden; }

        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .btn-grid button {
            height: 60px; border-radius: 15px; border: none; font-size: 1.2rem;
            font-weight: 600; cursor: pointer; background: var(--btn-hover); color: var(--text);
        }
        button.op { color: var(--accent); background: var(--btn-sci); }
        button.eq { background: var(--accent); color: white; }
        
        .sci-panel { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 160px; 
            background: var(--btn-sci); padding: 15px; border-radius: 25px;
        }
        .sci-panel button { height: 50px; font-size: 0.9rem; }

        /* --- PŘEVODNÍK STYLY --- */
        .converter-card { max-width: 600px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-sec); }
        select, input {
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 1rem; outline: none;
        }
        select:focus, input:focus { border-color: var(--accent); }

        /* --- HISTORIE --- */
        .hist-card { width: 250px; font-size: 0.9rem; max-height: 580px; overflow-y: auto; }
        .hist-item { padding: 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .hist-item:hover { color: var(--accent); }

        @media (max-width: 950px) {
            nav { width: 80px; padding: 20px 10px; }
            nav .logo span, nav .nav-item span { display: none; }
            main { margin-left: 80px; }
            .tool-section.active { flex-direction: column; align-items: center; }
            .sci-panel { width: 100%; grid-template-columns: repeat(4, 1fr); }
            .calc-card { width: 100%; max-width: 400px; }
        }
    </style>
</head>
<body data-theme="dark">

    <nav>
        <div class="logo">🛠️ <span>ToolBox</span></div>
        <div class="nav-item active" onclick="showTool('calc', this)"><span>🧮</span> <span>Kalkulačka</span></div>
        <div class="nav-item" onclick="showTool('conv', this)"><span>📏</span> <span>Převodník</span></div>
        <div class="nav-item" onclick="showTool('pass', this)"><span>🔐</span> <span>Hesla</span></div>
        <div class="nav-item" onclick="showTool('text', this)"><span>✍️</span> <span>Text</span></div>
    </nav>

    <main>
        <header>
            <h1 id="page-title">Kalkulačka</h1>
            <button class="theme-btn" onclick="toggleTheme()">☀️</button>
        </header>

        <!-- TOOL: KALKULAČKA -->
        <section id="tool-calc" class="tool-section active">
            <div class="card calc-card">
                <div class="display" onclick="copyResult()">
                    <div id="display-history"></div>
                    <div id="display-main">0</div>
                </div>
                <div class="btn-grid">
                    <button class="op" style="color: #ff3b30;" onclick="fullClear()">AC</button>
                    <button class="op" onclick="deleteLast()">⌫</button>
                    <button class="op" onclick="appendOp('%')">%</button>
                    <button class="op" onclick="appendOp('/')">÷</button>
                    
                    <button onclick="appendNum('7')">7</button>
                    <button onclick="appendNum('8')">8</button>
                    <button onclick="appendNum('9')">9</button>
                    <button class="op" onclick="appendOp('*')">×</button>
                    
                    <button onclick="appendNum('4')">4</button>
                    <button onclick="appendNum('5')">5</button>
                    <button onclick="appendNum('6')">6</button>
                    <button class="op" onclick="appendOp('-')">−</button>
                    
                    <button onclick="appendNum('1')">1</button>
                    <button onclick="appendNum('2')">2</button>
                    <button onclick="appendNum('3')">3</button>
                    <button class="op" onclick="appendOp('+')">+</button>
                    
                    <button onclick="appendNum('0')">0</button>
                    <button onclick="appendNum('.')">.</button>
                    <button class="eq" style="grid-column: span 2;" onclick="calculate()">=</button>
                </div>
            </div>

            <div class="sci-panel">
                <button class="op" onclick="sci('sin')">sin</button>
                <button class="op" onclick="sci('cos')">cos</button>
                <button class="op" onclick="sci('tan')">tan</button>
                <button class="op" onclick="sci('log')">log</button>
                <button class="op" onclick="sci('sqrt')">√x</button>
                <button class="op" onclick="sci('pow2')">x²</button>
                <button class="op" onclick="sci('fact')">n!</button>
                <button class="op" onclick="appendNum(Math.PI.toFixed(4))">π</button>
            </div>

            <div class="card hist-card">
                <h4 style="margin-bottom: 10px;">Historie</h4>
                <div id="hist-list"></div>
            </div>
        </section>

        <!-- TOOL: PŘEVODNÍK -->
        <section id="tool-conv" class="tool-section">
            <div class="card converter-card">
                <div class="input-group">
                    <label>Kategorie</label>
                    <select id="conv-cat" onchange="updateUnits()">
                        <option value="length">Délka (km, m, mile...)</option>
                        <option value="mass">Hmotnost (kg, g, lb...)</option>
                        <option value="temp">Teplota (°C, °F, K)</option>
                    </select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="input-group">
                        <label>Z jednotky</label>
                        <select id="unit-from"></select>
                        <input type="number" id="val-from" value="1" oninput="doConvert()">
                    </div>
                    <div class="input-group">
                        <label>Na jednotku</label>
                        <select id="unit-to"></select>
                        <input type="number" id="val-to" readonly>
                    </div>
                </div>
            </div>
        </section>

        <!-- OSTATNÍ SEKCE (Hesla, Text) - Zjednodušeno pro délku kódu -->
        <section id="tool-pass" class="tool-section">
            <div class="card" style="max-width: 500px;">
                <h3>Generátor hesla</h3>
                <input type="text" id="p-out" readonly style="margin: 20px 0; text-align: center; font-weight: bold;">
                <button class="eq" style="width:100%; padding:15px; border-radius:12px; border:none; cursor:pointer" onclick="genPass()">Generovat</button>
            </div>
        </section>

    </main>

    <script>
        // --- GLOBÁLNÍ LOGIKA ---
        function showTool(id, btn) {
            document.querySelectorAll('.tool-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('tool-' + id).classList.add('active');
            btn.classList.add('active');
            document.getElementById('page-title').innerText = btn.innerText.replace(/[^\w\sáčďéěíňóřšťúůýž]/gi, '');
        }

        function toggleTheme() {
            const b = document.body;
            const isDark = b.getAttribute('data-theme') === 'dark';
            b.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.querySelector('.theme-btn').innerText = isDark ? '🌙' : '☀️';
        }

        // --- KALKULAČKA (PLNÁ VERZE) ---
        let current = '0', prev = '', op = null, reset = false;
        let history = [];

        function fmt(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
        function updateD() { 
            document.getElementById('display-main').innerText = fmt(current);
            document.getElementById('display-main').style.fontSize = current.length > 10 ? '1.5rem' : '2.5rem';
        }

        function appendNum(n) {
            if (current === '0' || reset) { current = n; reset = false; }
            else { if (n === '.' && current.includes('.')) return; current += n; }
            updateD();
        }

        function appendOp(o) {
            if (op) calculate();
            prev = current; op = o;
            document.getElementById('display-history').innerText = `${fmt(prev)} ${o}`;
            reset = true;
        }

        function calculate() {
            if (!op || reset) return;
            let r;
            const p = parseFloat(prev), c = parseFloat(current);
            if (op === '+') r = p + c;
            if (op === '-') r = p - c;
            if (op === '*') r = p * c;
            if (op === '/') r = c === 0 ? "Chyba" : p / c;
            if (op === '%') r = p % c;
            
            r = Math.round(r * 1000000) / 1000000;
            history.unshift(`${prev} ${op} ${current} = ${r}`);
            if(history.length > 10) history.pop();
            renderHist();

            current = r.toString(); op = null; reset = true;
            document.getElementById('display-history').innerText = "";
            updateD();
        }

        function sci(f) {
            let v = parseFloat(current);
            if (f === 'sin') v = Math.sin(v * Math.PI / 180);
            if (f === 'cos') v = Math.cos(v * Math.PI / 180);
            if (f === 'tan') v = Math.tan(v * Math.PI / 180);
            if (f === 'log') v = Math.log10(v);
            if (f === 'sqrt') v = Math.sqrt(v);
            if (f === 'pow2') v = v * v;
            if (f === 'fact') { let r = 1; for(let i=2; i<=v; i++) r *= i; v = r; }
            current = (Math.round(v * 1000000) / 1000000).toString();
            updateD();
        }

        function fullClear() { current = '0'; prev = ''; op = null; updateD(); document.getElementById('display-history').innerText = ""; }
        function deleteLast() { current = current.length > 1 ? current.slice(0, -1) : '0'; updateD(); }
        
        function renderHist() {
            document.getElementById('hist-list').innerHTML = history.map(h => `<div class="hist-item" onclick="current='${h.split('=')[1].trim()}'; updateD();">${h}</div>`).join('');
        }

        function copyResult() { navigator.clipboard.writeText(current); }

        // --- PŘEVODNÍK JEDNOTEK ---
        const units = {
            length: { km: 1000, m: 1, cm: 0.01, mm: 0.001, mile: 1609.34, yard: 0.9144, inch: 0.0254 },
            mass: { kg: 1000, g: 1, mg: 0.001, lb: 453.59, oz: 28.35 },
            temp: { c: 'c', f: 'f', k: 'k' }
        };

        function updateUnits() {
            const cat = document.getElementById('conv-cat').value;
            const from = document.getElementById('unit-from');
            const to = document.getElementById('unit-to');
            from.innerHTML = to.innerHTML = "";
            Object.keys(units[cat]).forEach(u => {
                from.add(new Option(u, u));
                to.add(new Option(u, u));
            });
            if(cat === 'length') to.value = 'm';
            doConvert();
        }

        function doConvert() {
            const cat = document.getElementById('conv-cat').value;
            const uFrom = document.getElementById('unit-from').value;
            const uTo = document.getElementById('unit-to').value;
            const val = parseFloat(document.getElementById('val-from').value);
            let res;

            if (cat === 'temp') {
                let celsius;
                if (uFrom === 'c') celsius = val;
                else if (uFrom === 'f') celsius = (val - 32) * 5/9;
                else celsius = val - 273.15;

                if (uTo === 'c') res = celsius;
                else if (uTo === 'f') res = (celsius * 9/5) + 32;
                else res = celsius + 273.15;
            } else {
                const base = val * units[cat][uFrom];
                res = base / units[cat][uTo];
            }
            document.getElementById('val-to').value = res.toFixed(4);
        }

        document.getElementById('unit-from').onchange = doConvert;
        document.getElementById('unit-to').onchange = doConvert;

        // --- HESLA ---
        function genPass() {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
            let p = "";
            for(let i=0; i<16; i++) p += chars[Math.floor(Math.random() * chars.length)];
            document.getElementById('p-out').value = p;
        }

        // Init
        updateUnits();
        updateD();
    </script>
</body>
</html>
