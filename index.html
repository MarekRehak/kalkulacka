<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolBox Hub Pro</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --sidebar: #ffffff;
            --card: #ffffff;
            --text: #1d1d1f;
            --text-sec: #86868b;
            --accent: #0071e3;
            --btn-hover: #f2f2f7;
            --border: #d2d2d7;
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg: #0a0a0a;
            --sidebar: #1c1c1e;
            --card: #2c2c2e;
            --text: #ffffff;
            --text-sec: #a1a1a6;
            --accent: #0a84ff;
            --btn-hover: #3a3a3c;
            --border: #48484a;
            --shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }

        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; transition: 0.3s; }

        /* NAVIGACE */
        nav {
            width: 260px; background: var(--sidebar); border-right: 1px solid var(--border);
            padding: 30px 20px; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: 800; margin-bottom: 40px; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        .nav-item {
            padding: 14px 18px; border-radius: 12px; cursor: pointer; margin-bottom: 8px;
            display: flex; align-items: center; gap: 15px; color: var(--text-sec); font-weight: 500; transition: 0.2s;
        }
        .nav-item:hover { background: var(--btn-hover); color: var(--text); }
        .nav-item.active { background: var(--accent); color: white; }

        /* OBSAH */
        main { flex-grow: 1; margin-left: 260px; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        .theme-btn {
            background: var(--btn-hover); border: none; width: 45px; height: 45px;
            border-radius: 50%; cursor: pointer; font-size: 1.2rem; color: var(--text);
        }

        .tool-section { display: none; width: 100%; max-width: 900px; animation: fadeIn 0.3s ease; }
        .tool-section.active { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); padding: 25px; border-radius: 24px; box-shadow: var(--shadow); color: var(--text); }

        /* KALKULAČKA STYLY */
        .calc-main { width: 360px; }
        .display { background: var(--bg); padding: 20px; border-radius: 20px; text-align: right; margin-bottom: 20px; }
        #display-hist { font-size: 0.8rem; color: var(--text-sec); min-height: 1.2em; }
        #display-val { font-size: 2.5rem; font-weight: 600; color: var(--text); }
        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .btn-grid button {
            height: 60px; border-radius: 15px; border: none; font-size: 1.2rem; cursor: pointer;
            background: var(--btn-hover); color: var(--text); font-weight: 600;
        }
        button.op { color: var(--accent); }
        button.eq { background: var(--accent) !important; color: white !important; }
        .sci-bar { width: 140px; display: flex; flex-direction: column; gap: 10px; }
        .sci-bar button { height: 45px; border-radius: 12px; border: none; background: var(--btn-hover); color: var(--text); cursor: pointer; font-size: 0.9rem; }

        /* INPUTY & OSTATNÍ */
        input, select, textarea {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); margin-top: 8px; font-size: 1rem;
        }
        .label { font-size: 0.85rem; color: var(--text-sec); margin-top: 15px; }

        /* PŘEVODNÍK GRID */
        .conv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }

        @media (max-width: 900px) {
            nav { width: 80px; padding: 20px 10px; }
            nav .logo span, nav .nav-item span { display: none; }
            main { margin-left: 80px; padding: 20px; }
        }
    </style>
</head>
<body data-theme="dark">

    <nav>
        <div class="logo">🛠️ <span>ToolHub</span></div>
        <div class="nav-item active" onclick="showTool('calc', this)"><span>🧮</span> <span>Kalkulačka</span></div>
        <div class="nav-item" onclick="showTool('conv', this)"><span>📏</span> <span>Převodník</span></div>
        <div class="nav-item" onclick="showTool('pass', this)"><span>🔐</span> <span>Hesla</span></div>
        <div class="nav-item" onclick="showTool('text', this)"><span>✍️</span> <span>Text</span></div>
        <div class="nav-item" onclick="showTool('color', this)"><span>🎨</span> <span>Barvy</span></div>
    </nav>

    <main>
        <header>
            <h1 id="title">Kalkulačka</h1>
            <button class="theme-btn" onclick="toggleTheme()">☀️</button>
        </header>

        <!-- KALKULAČKA -->
        <section id="tool-calc" class="tool-section active">
            <div class="card calc-main">
                <div class="display" onclick="navigator.clipboard.writeText(currentInput)">
                    <div id="display-hist"></div>
                    <div id="display-val">0</div>
                </div>
                <div class="btn-grid">
                    <button class="op" onclick="fullClear()" style="color: #ff3b30">AC</button>
                    <button class="op" onclick="del()">⌫</button>
                    <button class="op" onclick="setOp('%')">%</button>
                    <button class="op" onclick="setOp('/')">÷</button>
                    <button onclick="num('7')">7</button><button onclick="num('8')">8</button><button onclick="num('9')">9</button>
                    <button class="op" onclick="setOp('*')">×</button>
                    <button onclick="num('4')">4</button><button onclick="num('5')">5</button><button onclick="num('6')">6</button>
                    <button class="op" onclick="setOp('-')">−</button>
                    <button onclick="num('1')">1</button><button onclick="num('2')">2</button><button onclick="num('3')">3</button>
                    <button class="op" onclick="setOp('+')">+</button>
                    <button onclick="num('0')">0</button><button onclick="num('.')">.</button>
                    <button class="eq" style="grid-column: span 2" onclick="calc()">=</button>
                </div>
            </div>
            <div class="sci-bar">
                <button onclick="sci('sin')">sin</button><button onclick="sci('cos')">cos</button>
                <button onclick="sci('sqrt')">√x</button><button onclick="sci('pow')">x²</button>
                <button onclick="sci('log')">log</button><button onclick="num(Math.PI.toFixed(4))">π</button>
                <div class="card" id="hist-box" style="font-size: 0.7rem; height: 180px; overflow-y: auto; padding: 10px;">
                    <div style="opacity: 0.5; margin-bottom: 5px;">Historie</div>
                    <div id="hist-content"></div>
                </div>
            </div>
        </section>

        <!-- PŘEVODNÍK -->
        <section id="tool-conv" class="tool-section">
            <div class="card" style="width: 100%; max-width: 600px;">
                <div class="label">Kategorie</div>
                <select id="conv-cat" onchange="initUnits()">
                    <option value="len">Délka</option>
                    <option value="weight">Hmotnost</option>
                    <option value="temp">Teplota</option>
                </select>
                <div class="conv-grid" style="margin-top: 20px;">
                    <div>
                        <div class="label">Z jednotky</div>
                        <select id="u-from" onchange="doConv()"></select>
                        <input type="number" id="v-from" value="1" oninput="doConv()">
                    </div>
                    <div>
                        <div class="label">Na jednotku</div>
                        <select id="u-to" onchange="doConv()"></select>
                        <input type="number" id="v-to" readonly>
                    </div>
                </div>
            </div>
        </section>

        <!-- HESLA -->
        <section id="tool-pass" class="tool-section">
            <div class="card" style="width: 400px; text-align: center;">
                <input type="text" id="p-out" readonly style="text-align: center; font-family: monospace; font-size: 1.2rem; font-weight: bold; padding: 20px;">
                <div class="label">Délka hesla: <span id="p-len-label">16</span></div>
                <input type="range" id="p-len" min="6" max="64" value="16" oninput="document.getElementById('p-len-label').innerText=this.value; genPass();">
                <button class="eq" style="width: 100%; margin-top: 20px; padding: 15px; border-radius: 12px; border: none; cursor: pointer;" onclick="genPass()">Generovat nové heslo</button>
            </div>
        </section>

        <!-- TEXT -->
        <section id="tool-text" class="tool-section">
            <div class="card" style="width: 100%; max-width: 700px;">
                <textarea id="t-in" rows="10" placeholder="Sem vložte text..." oninput="analyzeText()"></textarea>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="sci-bar button" style="padding: 10px; width: 100%;" onclick="textModify('up')">VELKÁ</button>
                    <button class="sci-bar button" style="padding: 10px; width: 100%;" onclick="textModify('low')">malá</button>
                    <button class="sci-bar button" style="padding: 10px; width: 100%;" onclick="textModify('clean')">Bez diakritiky</button>
                </div>
                <div style="margin-top: 15px; display: flex; gap: 20px; color: var(--text-sec);">
                    <span>Slova: <b id="cnt-w" style="color: var(--accent);">0</b></span>
                    <span>Znaky: <b id="cnt-c" style="color: var(--accent);">0</b></span>
                </div>
            </div>
        </section>

        <!-- BARVY -->
        <section id="tool-color" class="tool-section">
            <div class="card" style="width: 400px; text-align: center;">
                <input type="color" id="c-picker" value="#0071e3" style="height: 150px; border: none; background: none;" oninput="updateColor(this.value)">
                <div class="label">HEX kód</div>
                <input type="text" id="c-hex" readonly style="text-align: center;">
                <div class="label">RGB kód</div>
                <input type="text" id="c-rgb" readonly style="text-align: center;">
                <button class="eq" style="width: 100%; margin-top: 20px; padding: 15px; border: none; border-radius: 12px; cursor: pointer;" onclick="copyColor()">Kopírovat HEX</button>
            </div>
        </section>
    </main>

    <script>
        // NAVIGATION
        function showTool(id, btn) {
            document.querySelectorAll('.tool-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('tool-' + id).classList.add('active');
            btn.classList.add('active');
            document.getElementById('title').innerText = btn.innerText;
        }

        function toggleTheme() {
            const b = document.body;
            const isDark = b.getAttribute('data-theme') === 'dark';
            b.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.querySelector('.theme-btn').innerText = isDark ? '🌙' : '☀️';
        }

        // --- CALC LOGIC ---
        let currentInput = '0', prevInput = '', operator = null, shouldReset = false;
        function updateDisplay() {
            document.getElementById('display-val').innerText = currentInput.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        }
        function num(n) {
            if (currentInput === '0' || shouldReset) { currentInput = n; shouldReset = false; }
            else { if (n === '.' && currentInput.includes('.')) return; currentInput += n; }
            updateDisplay();
        }
        function setOp(op) {
            if (operator) calc();
            prevInput = currentInput; operator = op;
            document.getElementById('display-hist').innerText = `${prevInput} ${op}`;
            shouldReset = true;
        }
        function calc() {
            if (!operator || shouldReset) return;
            let r;
            const a = parseFloat(prevInput), b = parseFloat(currentInput);
            if (operator === '+') r = a + b;
            if (operator === '-') r = a - b;
            if (operator === '*') r = a * b;
            if (operator === '/') r = b === 0 ? 'Chyba' : a / b;
            if (operator === '%') r = a % b;
            
            r = Math.round(r * 1000000) / 1000000;
            const hItem = document.createElement('div');
            hItem.innerText = `${prevInput} ${operator} ${currentInput} = ${r}`;
            document.getElementById('hist-content').prepend(hItem);
            
            currentInput = r.toString(); operator = null; shouldReset = true;
            document.getElementById('display-hist').innerText = "";
            updateDisplay();
        }
        function sci(f) {
            let v = parseFloat(currentInput);
            if (f === 'sin') v = Math.sin(v * Math.PI / 180);
            if (f === 'cos') v = Math.cos(v * Math.PI / 180);
            if (f === 'sqrt') v = Math.sqrt(v);
            if (f === 'pow') v = v * v;
            if (f === 'log') v = Math.log10(v);
            currentInput = (Math.round(v * 1000000) / 1000000).toString();
            updateDisplay();
        }
        function fullClear() { currentInput = '0'; prevInput = ''; operator = null; updateDisplay(); document.getElementById('display-hist').innerText = ""; }
        function del() { currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0'; updateDisplay(); }

        // --- CONVERTER ---
        const units = {
            len: { m: 1, km: 1000, cm: 0.01, mm: 0.001, mil: 1609.34, inch: 0.0254 },
            weight: { g: 1, kg: 1000, t: 1000000, lb: 453.59, oz: 28.35 },
            temp: { c: 'c', f: 'f', k: 'k' }
        };
        function initUnits() {
            const cat = document.getElementById('conv-cat').value;
            const f = document.getElementById('u-from'), t = document.getElementById('u-to');
            f.innerHTML = t.innerHTML = "";
            Object.keys(units[cat]).forEach(u => {
                f.add(new Option(u, u)); t.add(new Option(u, u));
            });
            doConv();
        }
        function doConv() {
            const cat = document.getElementById('conv-cat').value;
            const val = parseFloat(document.getElementById('v-from').value);
            const uF = document.getElementById('u-from').value, uT = document.getElementById('u-to').value;
            let res;
            if (cat === 'temp') {
                let c = uF === 'c' ? val : uF === 'f' ? (val - 32) * 5/9 : val - 273.15;
                res = uT === 'c' ? c : uT === 'f' ? (c * 9/5) + 32 : c + 273.15;
            } else {
                res = (val * units[cat][uF]) / units[cat][uT];
            }
            document.getElementById('v-to').value = res.toFixed(4);
        }

        // --- PASSWORDS ---
        function genPass() {
            const len = document.getElementById('p-len').value;
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
            let p = "";
            for(let i=0; i<len; i++) p += chars.charAt(Math.floor(Math.random()*chars.length));
            document.getElementById('p-out').value = p;
        }

        // --- TEXT ---
        function analyzeText() {
            const t = document.getElementById('t-in').value;
            document.getElementById('cnt-c').innerText = t.length;
            document.getElementById('cnt-w').innerText = t.trim() ? t.trim().split(/\s+/).length : 0;
        }
        function textModify(m) {
            let el = document.getElementById('t-in');
            if (m === 'up') el.value = el.value.toUpperCase();
            if (m === 'low') el.value = el.value.toLowerCase();
            if (m === 'clean') el.value = el.value.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            analyzeText();
        }

        // --- COLORS ---
        function updateColor(h) {
            document.getElementById('c-hex').value = h.toUpperCase();
            const r = parseInt(h.slice(1,3), 16), g = parseInt(h.slice(3,5), 16), b = parseInt(h.slice(5,7), 16);
            document.getElementById('c-rgb').value = `rgb(${r}, ${g}, ${b})`;
        }
        function copyColor() { navigator.clipboard.writeText(document.getElementById('c-hex').value); }

        // START
        initUnits();
        genPass();
        updateColor('#0071E3');
    </script>
</body>
</html>
