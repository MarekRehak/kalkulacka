<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Kalkulačka s Historií</title>
    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-calc: #ffffff;
            --text-main: #1d1d1f;
            --display-bg: #f5f5f7;
            --btn-num: #ffffff;
            --btn-op: #e5e5ea;
            --btn-spec: #d1d1d6;
            --btn-accent: #007aff;
            --history-bg: rgba(255, 255, 255, 0.7);
            --shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-body: #000000;
            --bg-calc: #1c1c1e;
            --text-main: #ffffff;
            --display-bg: #2c2c2e;
            --btn-num: #3a3a3c;
            --btn-op: #48484a;
            --btn-spec: #636366;
            --history-bg: rgba(28, 28, 30, 0.8);
            --shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background 0.3s, color 0.3s; }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* DARK MODE TOGGLE V ROHU */
        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: var(--bg-calc);
            border: 1px solid var(--btn-op);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--shadow);
            width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
        }

        /* HISTORIE PANEL */
        .history-panel {
            width: 250px;
            height: 520px;
            background: var(--history-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .history-panel h3 {
            color: var(--text-main);
            margin-bottom: 15px;
            font-size: 1rem;
            opacity: 0.6;
        }

        #history-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid var(--btn-op);
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .history-item:hover { background: rgba(0,0,0,0.05); }
        .history-item .result { display: block; font-weight: bold; font-size: 1rem; color: var(--btn-accent); }

        /* KALKULAČKA */
        .calculator {
            background-color: var(--bg-calc);
            width: 360px;
            padding: 24px;
            border-radius: 32px;
            box-shadow: var(--shadow);
        }

        .display {
            width: 100%;
            background: var(--display-bg);
            margin-bottom: 24px;
            padding: 25px;
            text-align: right;
            border-radius: 20px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        #display-history { font-size: 0.9rem; color: #8e8e93; min-height: 1.2rem; margin-bottom: 5px; }
        #display-main { font-size: 2.5rem; font-weight: 500; color: var(--text-main); overflow: hidden; }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            height: 60px;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-main);
            background-color: var(--btn-num);
        }

        button:active { transform: scale(0.95); }
        button.op { background-color: var(--btn-op); color: var(--btn-accent); font-weight: 600; }
        button.spec { background-color: var(--btn-spec); font-size: 1rem; }
        button.equal { background-color: var(--btn-accent); color: white; grid-column: span 1; }
        button.clear { color: #ff3b30; }

        /* Mobilní optimalizace */
        @media (max-width: 600px) {
            body { flex-direction: column; padding: 60px 10px 10px 10px; }
            .history-panel { width: 100%; height: 150px; order: 2; }
            .calculator { width: 100%; order: 1; }
        }
    </style>
</head>
<body data-theme="dark">

    <button class="theme-switch" onclick="toggleTheme()" id="themeIcon">☀️</button>

    <div class="history-panel">
        <h3>Historie (posledních 10)</h3>
        <ul id="history-list"></ul>
    </div>

    <div class="calculator">
        <div class="display">
            <div id="display-history"></div>
            <div id="display-main">0</div>
        </div>

        <div class="buttons">
            <!-- Vědecké/Speciální funkce -->
            <button class="spec" onclick="calculateSpecial('pow2')">x²</button>
            <button class="spec" onclick="calculateSpecial('sqrt')">√</button>
            <button class="spec" onclick="appendNumber(Math.PI.toFixed(4))">π</button>
            <button class="spec" onclick="calculateSpecial('sign')">±</button>

            <button class="clear op" onclick="fullClear()">AC</button>
            <button class="op" onclick="deleteLast()">DEL</button>
            <button class="op" onclick="appendOperator('%')">%</button>
            <button class="op" onclick="appendOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="op" onclick="appendOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="op" onclick="appendOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="op" onclick="appendOperator('+')">+</button>

            <button onclick="appendNumber('0')" style="grid-column: span 1;">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="equal" onclick="calculate()" style="grid-column: span 2;">=</button>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldReset = false;
        let history = [];

        const displayMain = document.getElementById('display-main');
        const displayHistory = document.getElementById('display-history');
        const historyList = document.getElementById('history-list');

        function updateDisplay() {
            displayMain.innerText = currentInput;
        }

        function appendNumber(num) {
            if (currentInput === '0' || shouldReset) {
                currentInput = num.toString();
                shouldReset = false;
            } else {
                if (num === '.' && currentInput.includes('.')) return;
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (operator !== null) calculate();
            previousInput = currentInput;
            operator = op;
            displayHistory.innerText = `${previousInput} ${op}`;
            shouldReset = true;
        }

        function calculate() {
            if (operator === null || shouldReset) return;
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            switch (operator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': result = current === 0 ? 'Chyba' : prev / current; break;
                case '%': result = prev % current; break;
                default: return;
            }

            result = formatResult(result);
            addToHistory(`${previousInput} ${operator} ${currentInput}`, result);
            
            displayHistory.innerText = `${previousInput} ${operator} ${currentInput} =`;
            currentInput = result.toString();
            operator = null;
            shouldReset = true;
            updateDisplay();
        }

        function calculateSpecial(type) {
            let val = parseFloat(currentInput);
            let res;
            switch(type) {
                case 'pow2': res = val * val; break;
                case 'sqrt': res = Math.sqrt(val); break;
                case 'sign': res = val * -1; break;
            }
            currentInput = formatResult(res).toString();
            updateDisplay();
        }

        function formatResult(num) {
            if (isNaN(num)) return "Chyba";
            return Math.round(num * 10000000) / 10000000;
        }

        function fullClear() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            displayHistory.innerText = '';
            updateDisplay();
        }

        function deleteLast() {
            if (shouldReset) {
                displayHistory.innerText = '';
                return;
            }
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function addToHistory(expression, result) {
            if (result === "Chyba") return;
            history.unshift({ expression, result });
            if (history.length > 10) history.pop();
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = '';
            history.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `<span>${item.expression} =</span><span class="result">${item.result}</span>`;
                li.onclick = () => {
                    currentInput = item.result.toString();
                    updateDisplay();
                };
                historyList.appendChild(li);
            });
        }

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                icon.innerText = '🌙';
            } else {
                body.setAttribute('data-theme', 'dark');
                icon.innerText = '☀️';
            }
        }

        // Klávesnice
        window.onkeydown = (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendNumber('.');
            if (e.key === 'Enter' || e.key === '=') calculate();
            if (e.key === 'Backspace') deleteLast();
            if (e.key === 'Escape') fullClear();
            if (['+', '-', '*', '/'].includes(e.key)) appendOperator(e.key);
        };
    </script>
</body>
</html>
